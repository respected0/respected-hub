[package]
name = "respected-hub"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri-plugin-single-instance = "2"
ed25519-dalek = "2"
base64 = "0.22"

[features]
# Development trust: dev signing key + the explicit unsigned opt-in. NEVER enabled for production builds (debug builds have it implicitly).
dev-trust = []

[lib]
name = "respected_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dev-dependencies]
sha2 = "0.10"
