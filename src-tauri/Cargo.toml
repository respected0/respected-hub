[package]
name = "respected-hub"
version = "0.1.0-beta.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri-plugin-single-instance = "2"
ed25519-dalek = "2"
base64 = "0.22"

[features]
# Development trust: dev signing key + the explicit unsigned opt-in. NEVER enabled for production builds (debug builds have it implicitly).
dev-trust = []

[lib]
name = "respected_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# End-to-end tests live in one folder per area; each file stays its own test binary (`cargo test --test brain_e2e`).
[[test]]
name = "lifecycle_e2e"
path = "tests/lifecycle/lifecycle_e2e.rs"

[[test]]
name = "installer_e2e"
path = "tests/lifecycle/installer_e2e.rs"

[[test]]
name = "cleanup_e2e"
path = "tests/lifecycle/cleanup_e2e.rs"

[[test]]
name = "remote_catalog_e2e"
path = "tests/lifecycle/remote_catalog_e2e.rs"

[[test]]
name = "trust_catalog_e2e"
path = "tests/lifecycle/trust_catalog_e2e.rs"

[[test]]
name = "brain_e2e"
path = "tests/secondbrain/brain_e2e.rs"

[[test]]
name = "brain_concurrency_e2e"
path = "tests/secondbrain/brain_concurrency_e2e.rs"

[[test]]
name = "memory_access_e2e"
path = "tests/secondbrain/memory_access_e2e.rs"

[[test]]
name = "memory_index_e2e"
path = "tests/secondbrain/memory_index_e2e.rs"

[[test]]
name = "campaign_e2e"
path = "tests/orchestrator/campaign_e2e.rs"

[[test]]
name = "mcp_access_e2e"
path = "tests/orchestrator/mcp_access_e2e.rs"
