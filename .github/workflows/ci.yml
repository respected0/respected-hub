name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  CARGO_TERM_COLOR: never

jobs:
  test:
    # The Rust end-to-end tests drive the real sibling products on disposable roots, so the three repositories are
    # checked out side by side exactly like a development ecosystem folder.
    name: hub (windows)
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      RESPECTED_ECOSYSTEM_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: respected-hub
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: respected0/respected-brain
          path: respected-brain
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: respected0/respected-orchestrator
          path: respected-orchestrator
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - name: Install products and release tooling
        run: python -m pip install -e "respected-brain[dev]" -e respected-orchestrator cryptography
      - name: TypeScript check and unit tests
        working-directory: respected-hub
        run: |
          npm ci
          npm run check
      - name: Release tooling self-check
        working-directory: respected-hub
        run: python common/release/tests/test_release_tools.py
      - name: Rust unit and end-to-end tests
        working-directory: respected-hub
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-fail-fast
      - name: Production trust set (release profile, no development keys)
        working-directory: respected-hub
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --lib production_build
      - name: Inno Setup (product installers)
        run: choco install innosetup --no-progress -y
      - name: Development signing key
        working-directory: respected-hub
        run: python common/release/tools/signing/bundle_signing.py init
      - name: Build Hub (debug)
        working-directory: respected-hub
        run: npx tauri build --debug --no-bundle
      - name: Allow WebView2 DevTools on the runner (WebView2 150+ ignores the env var for elevated hosts)
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name 'respected-hub.exe' -Value '--remote-debugging-port=9333' -PropertyType String -Force
      - name: Native E2E (WebView2, real installers)
        working-directory: respected-hub
        run: node tests/native/hub_native_e2e.mjs src-tauri/target/debug/respected-hub.exe --report ../native-report
      - name: Upload native E2E report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-e2e
          path: native-report
          if-no-files-found: warn

  update:
    # REL-001: the published installer of the previous release, then this build's installer over it.
    name: hub update (windows)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RESPECTED_ECOSYSTEM_ROOT: ${{ github.workspace }}
      OLD_TAG: v0.1.0-beta.2
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: respected-hub
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - name: Install release tooling and Inno Setup
        run: |
          python -m pip install cryptography
          choco install innosetup --no-progress -y
      - name: Previous release installer
        shell: bash
        run: gh release download "$OLD_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*Setup.exe' --dir old
      - name: Build this version's installer
        working-directory: respected-hub
        run: |
          npm ci
          python common/release/tools/build/build_hub_installer.py
      - name: Update over the previous release
        shell: bash
        working-directory: respected-hub
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          python common/release/tools/acceptance/accept_update.py \
            --old "$(ls ../old/*Setup.exe)" --old-version "${OLD_TAG#v}" \
            --new ../dist/RespectedHub-Windows-Setup.exe --new-version "$version" \
            --new-exe ../.build-cache/hub-stage/respected-hub.exe

  cross-platform:
    # PORT-001: discovery, read-only scan and integration plan/apply contracts
    # on real macOS and Linux runners. Product installers and the Windows
    # packaging/campaign suites stay covered by the windows job.
    name: hub (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: respected-hub
      - name: Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libssl-dev
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - name: TypeScript check and unit tests
        working-directory: respected-hub
        run: |
          npm ci
          npm run check
      - name: Rust unit tests
        working-directory: respected-hub
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Integration contract tests
        working-directory: respected-hub
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml --no-fail-fast
          --test inventory_e2e --test claude_adapter_e2e --test catalog_e2e
          --test codex_adapter_e2e --test cursor_gemini_opencode_adapter_e2e
          --test skills_e2e --test plugins_e2e --test resolver_e2e
      - name: Production trust set (release profile, no development keys)
        working-directory: respected-hub
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --lib production_build
