<!doctype html>
<html lang="tr">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Respected Hub (güncelleme önizlemesi)</title>
  <script>
    // DEV-ONLY design preview, never part of the app (vite build only packs index.html): it pretends to be the desktop shell
    // so the screens can be looked at while Brain has an update waiting. Every number, step and version here is invented.
    // Run: npm run preview:update. Click through Güncelle > Onayla ve uygula: the fake product then moves to the new version.
    window.isTauri = true;
    const ok = result => ({ rpp: '1', ok: true, operation_id: null, result });
    const fail = { rpp: '1', ok: false, operation_id: null, result: null, error: { code: 'UNSUPPORTED_OP', message: 'Önizleme', hint: '' } };
    const checks = {
      brain: [{ name: 'data_root_writable', ok: true, detail: 'x' }, { name: 'config_loads', ok: true, detail: 'Configuration loaded' }, { name: 'vault_registered', ok: true, detail: 'Vault registered: C:\Users\Furkan\Documents\RespectedOS' }],
      orchestrator: [{ name: 'data_root_writable', ok: true, detail: 'x' }, { name: 'git_available', ok: true, detail: 'git' }, { name: 'worker_cli', ok: true, detail: 'claude, codex' }, { name: 'engine_key', ok: true, detail: 'engine key is created with the first task' }] };
    const product = (id, state, version, available) => ({ product: id, installed: true, install_state: state, version, recorded_at: String(Date.now() - 3600e3),
      available: { version: available, signed: true, trust: 'production', remote: true, size: 1 }, catalog_skipped: [], root: 'x' });
    const lifecycle = { catalog_root: 'x', products: [product('brain', 'update-available', '0.1.0b2', '0.1.0b3'), product('orchestrator', 'installed', '0.1.0b2', '0.1.0b2')] };
    const journal = [];
    const brain = () => lifecycle.products[0];
    window.__TAURI_INTERNALS__ = { transformCallback: () => 1, unregisterCallback() {}, convertFileSrc: x => x,
      invoke: async (cmd, args) => {
        // `?delay=300` makes every product call take that long (a real call starts a program: 240 to 570 ms); window.__calls lists what was asked.
        (window.__calls = window.__calls || []).push(cmd === 'rpp_request' ? args.product + ':' + args.op : cmd);
        const wait = Number(new URLSearchParams(location.search).get('delay') || 0);
        if (wait && (cmd === 'rpp_request' || cmd === 'engine_request' || cmd === 'memory_note_read')) await new Promise(resolve => setTimeout(resolve, wait));
        if (cmd === 'lifecycle_status') return { ok: true, result: lifecycle, error: null };
        if (cmd === 'activity_list') return { ok: true, result: journal, error: null };
        if (cmd === 'lifecycle_plan') return { ok: true, error: null, result: { product: args.product, action: args.action, from_version: brain().version, to_version: brain().available.version, plan: { steps: [
          { id: '1', summary: 'Brain\'in yeni kurucusu indirilir ve imzası doğrulanır (önizleme metni)', reversible: true, irreversible_reason: null },
          { id: '2', summary: 'Kurucu mevcut sürümün üzerine yeni programı yazar; not kasanıza dokunulmaz (önizleme metni)', reversible: true, irreversible_reason: null },
          { id: '3', summary: 'Kurulum sonrası Brain sağlık kontrolünden geçer (önizleme metni)', reversible: true, irreversible_reason: null }] } } };
        if (cmd === 'lifecycle_apply') {
          const entry = { operation_id: args.operationId, product: args.product, action: args.action, status: 'applied', from_version: brain().version, to_version: brain().available.version, started_at: String(Date.now()), finished_at: String(Date.now()), error: null };
          brain().version = brain().available.version; brain().install_state = 'installed'; brain().recorded_at = String(Date.now()); journal.unshift(entry);
          return { ok: true, result: entry, error: null };
        }
        if (cmd === 'hub_update_status') return { ok: true, result: { current: '0.1.0-beta.2', channel: 'stable', available: { version: '0.1.0-beta.3', size: 1, min_hub: null }, checked: true }, error: null };
        if (cmd === 'hub_update_install') return { ok: true, result: null, error: null };
        if (cmd === 'engine_request') return args.action === 'status' ? { workers: { claude: ['claude'], codex: ['codex'] } } : { runs: [] };
        if (cmd === 'rpp_request') {
          if (args.op === 'manifest') return ok({ rpp: '1', product_id: 'respected-' + args.product, product_version: lifecycle.products[args.product === 'brain' ? 0 : 1].version, capabilities: [] });
          if (args.op === 'health') return ok({ status: 'healthy', checks: checks[args.product] });
          if (args.op === 'settings.readback') return ok({ settings: { user_name: 'Furkan' } });
          return fail;
        }
        if (cmd === 'memory_note_read') return { ok: false, result: null, error: { code: 'NOT_FOUND', message: 'Önizlemede not yok.' } };
        if (cmd === 'campaign_list') return [];
        return null;
      } };
  </script></head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
